# Docker Compose for RabbitMQ (LTS / Management enabled)
#
# Usage:
#   docker compose up -d
#
# Management Console: http://localhost:15672
# Default credentials: username=guest, password=guest (or custom env vars)

version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq-node
    restart: unless-stopped

    # Environment variables to configure default credentials and vhost
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}

    ports:
      - "5672:5672"     # AMQP 0-9-1 / 1.0 protocol port
      - "15672:15672"   # Management Plugin HTTP UI & REST API

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
    driver: local


